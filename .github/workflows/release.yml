name: Build & Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (e.g. v0.1.3)'
        required: true
        type: string
  push:
    tags:
      - 'v*'
      - 'GBPOS'
      - 'GBPOS-*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ github.token }}
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY || secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
      VITE_SHOP_LOGIN_USERNAME: ${{ vars.VITE_SHOP_LOGIN_USERNAME || secrets.VITE_SHOP_LOGIN_USERNAME || 'Gadgetboyz' }}
      VITE_SHOP_LOGIN_EMAIL: ${{ vars.VITE_SHOP_LOGIN_EMAIL || secrets.VITE_SHOP_LOGIN_EMAIL }}
      VITE_PUBLIC_APP_URL: https://rumsmokes.github.io/Gadgetboy-Command-Center
      VITE_DURANT_LOGIN_EMAIL: ${{ vars.VITE_DURANT_LOGIN_EMAIL || secrets.VITE_DURANT_LOGIN_EMAIL }}
      GBPOS_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.GBPOS_ANDROID_KEYSTORE_PASSWORD }}
      GBPOS_ANDROID_KEY_ALIAS: ${{ secrets.GBPOS_ANDROID_KEY_ALIAS }}
      GBPOS_ANDROID_KEY_PASSWORD: ${{ secrets.GBPOS_ANDROID_KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Setup Java for Android
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Ensure Android SDK packages
        shell: pwsh
        run: |
          & "$env:ANDROID_HOME\cmdline-tools\latest\bin\sdkmanager.bat" "platforms;android-36" "build-tools;36.0.0"

      - name: Install deps
        run: npm ci

      - name: Generate icon
        run: node tools/generate-icon.cjs

      - name: Generate Instructions PDF
        run: node tools/generate-instructions-pdf.cjs

      - name: Typecheck renderer
        run: npx tsc -p tsconfig.json --noEmit

      - name: Typecheck electron main
        run: npx tsc -p tsconfig.electron.json --noEmit

      - name: Run release regression tests
        run: |
          npm run test:notifications:routing
          npm run test:sale-product-picker
          npm run test:quote-sales-prompt
          npm run test:client-update-api
          npm run test:mobile-long-press
          npm run test:mobile-navigation
          npm run test:mobile-command-center
          npm run test:workorder-cloud-clock
          npm run test:print-qr-existing-record
          npm run test:workorder-eta-print-sync
          npm run test:workorder-checkin-routing
          npm run test:command-center-task-routing
          npm run test:workorder-workflow-sync
          npm run test:desktop-calendar-fit
          npm run test:order-accounting
          npm run test:workorder-item-sync
          npm run test:reliability-patch
          npm run test:commission
          npm run test:customer-contact
          npm run test:consultation-location
          npm run test:consultation-pricing
          npm run test:consultation-partners
          npm run test:distributor-url
          npm run test:inventory-consumption
          npm run test:inventory-variants
          npm run test:inventory-parent-ui
          npm run test:inventory-device-groups
          npm run test:inventory-repair-matching
          npm run test:checkout-inventory-variants
          npm run test:inventory-reorder
          npm run test:inventory-part-persistence
          npm run test:calendar-journal-sync
          npm run test:calendar-tasks
          npm run test:immediate-persistence
          npm run test:daily-look-shifts
          npm run test:desktop-navigation
          npm run test:admin-multiwindow
          npm run test:context-menu-layer
          npm run test:repair-deletion
          npm run test:catalog-settings-navigation
          npm run test:vendor-catalog
          npm run test:catalog-defaults
          npm run test:checkout-layout
          npm run test:checkout-completion
          npm run test:checkout-delivery
          npm run test:command-center-repair-details
          npm run test:command-center-workflow
          npm run test:command-center-agenda-delivery
          npm run test:work-order-lifecycle
          npm run test:repair-statistics
          npm run test:product-delivery
          npm run test:repair-compatibility
          npm run test:main-record-types
          npm run test:repair-device-filters
          npm run test:technician-sync
          npm run test:windows-update-install
          npm run test:print-qr-readiness
          npm run test:release-form-qr-runtime
          npm run test:receipt-qr-runtime
          npm run test:command-center-live-runtime
          npm run test:command-center-stale-refresh
          npm run test:command-center-scroll-regions
          npm run test:custom-build-ordering
          npm run test:release-0593-features
          npm run test:release-0613-features
          npm run test:release-0614-features
          npm run test:auto-update-relaunch
          npm run test:eod-ticket-close
          npm run test:cart-client-updates
          npm run test:purchase-budget
          npm run test:ticket-accounting
          npm run test:line-item-discounts
          npm run test:durant-access
          npm run test:durant-styled-review
          npm run test:web-pwa-release
          npm run test:feedback-gidget

      - name: Build electron main
        run: npx tsc --project tsconfig.electron.json

      - name: Test Gidget resumable model download
        run: npm run test:gidget-download

      - name: Validate Supabase build config
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:VITE_SUPABASE_URL)) {
            throw "Missing VITE_SUPABASE_URL. Add it in GitHub repo Settings > Secrets and variables > Actions."
          }
          if ([string]::IsNullOrWhiteSpace($env:VITE_SUPABASE_PUBLISHABLE_KEY)) {
            throw "Missing VITE_SUPABASE_PUBLISHABLE_KEY. Add it in GitHub repo Settings > Secrets and variables > Actions."
          }
          if ([string]::IsNullOrWhiteSpace($env:VITE_SHOP_LOGIN_EMAIL)) {
            throw "Missing VITE_SHOP_LOGIN_EMAIL. Add the Supabase Auth email that Gadgetboyz should sign into."
          }

      - name: Build renderer (Vite)
        run: npx vite build --config vite.config.ts

      - name: Package installer (electron-builder)
        run: npx electron-builder --win nsis --publish never

      - name: Test packaged Gidget native runtime
        shell: pwsh
        run: |
          $testRoot = Join-Path $env:RUNNER_TEMP 'gbpos-gidget-packaged'
          $resultPath = Join-Path $env:RUNNER_TEMP 'gbpos-gidget-packaged-result.txt'
          node_modules\.bin\asar.cmd extract '.\release\win-unpacked\resources\app.asar' $testRoot
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $unpackedModules = '.\release\win-unpacked\resources\app.asar.unpacked\node_modules'
          if (Test-Path $unpackedModules) {
            Copy-Item -Path "$unpackedModules\*" -Destination (Join-Path $testRoot 'node_modules') -Recurse -Force
          }
          $env:GBPOS_GIDGET_TEST_RESULT = $resultPath
          & '.\node_modules\.bin\electron.cmd' '.\tools\test-gidget-packaged-runtime.cjs' $testRoot
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path $resultPath)) { throw 'Packaged Gidget test did not execute.' }
          if ((Get-Content $resultPath -Raw).Trim() -ne 'ok') { throw "Packaged Gidget test failed: $(Get-Content $resultPath -Raw)" }

      - name: Record release version
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          $setup = Join-Path 'release' "GB-POS-installerx64-$version.exe"
          if (-not (Test-Path $setup)) { throw "Setup installer not found: $setup" }
          "RELEASE_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build Android APK
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace('${{ secrets.GBPOS_ANDROID_KEYSTORE_BASE64 }}')) {
            throw 'Missing GBPOS_ANDROID_KEYSTORE_BASE64 GitHub secret.'
          }
          $keyStorePath = Join-Path $env:RUNNER_TEMP 'gadgetboy-pos-release.jks'
          [IO.File]::WriteAllBytes($keyStorePath, [Convert]::FromBase64String('${{ secrets.GBPOS_ANDROID_KEYSTORE_BASE64 }}'))
          $env:GBPOS_ANDROID_KEYSTORE_PATH = $keyStorePath
          npm.cmd run android:sync
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm.cmd run test:mobile-production-startup
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Push-Location android
          .\gradlew.bat assembleRelease
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Pop-Location
          $version = $env:RELEASE_VERSION
          $apkSource = 'android/app/build/outputs/apk/release/app-release.apk'
          if (-not (Test-Path $apkSource)) { throw "Android APK not found: $apkSource" }
          $buildTools = Get-ChildItem (Join-Path $env:ANDROID_HOME 'build-tools') -Directory | Sort-Object Name -Descending | Select-Object -First 1
          $aapt = Join-Path $buildTools.FullName 'aapt.exe'
          $apksigner = Join-Path $buildTools.FullName 'apksigner.bat'
          $badging = & $aapt dump badging $apkSource | Select-Object -First 1
          if ($badging -notmatch "name='com\.gadgetboy\.pos'") { throw "Unexpected Android application id: $badging" }
          if ($badging -notmatch "versionName='$([regex]::Escape($version))'") { throw "APK versionName does not match release $version`: $badging" }
          & $apksigner verify --verbose --print-certs $apkSource
          if ($LASTEXITCODE -ne 0) { throw 'Android APK signature verification failed.' }
          $newSigner = (& $apksigner verify --print-certs $apkSource | Select-String 'certificate SHA-256 digest:' | Select-Object -First 1 | ForEach-Object { ($_ -split ': ')[-1].Trim() })
          if ([string]::IsNullOrWhiteSpace($newSigner)) { throw 'Could not read the new APK signing certificate.' }
          $previousDir = Join-Path $env:RUNNER_TEMP 'previous-android-release'
          New-Item -ItemType Directory -Force -Path $previousDir | Out-Null
          gh release download --repo $env:GITHUB_REPOSITORY --pattern 'Android-APK-universal-*.apk' --dir $previousDir
          if ($LASTEXITCODE -eq 0) {
            $previousApk = Get-ChildItem $previousDir -Filter '*.apk' | Select-Object -First 1
            if ($previousApk) {
              $previousSigner = (& $apksigner verify --print-certs $previousApk.FullName | Select-String 'certificate SHA-256 digest:' | Select-Object -First 1 | ForEach-Object { ($_ -split ': ')[-1].Trim() })
              if ($previousSigner -ne $newSigner) { throw 'Android signing certificate changed; publishing this APK would force users to uninstall.' }
            }
          } else {
            # A brand-new release may not have an APK attached yet. The local
            # signature validation above still applies; do not leak gh's
            # expected "no assets match" status into the end of this step.
            $global:LASTEXITCODE = 0
          }
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Copy-Item -Force $apkSource "release/Android-APK-universal-$version.apk"

      - name: Generate release notes from CHANGELOG
        shell: pwsh
        run: |
          $version = $env:RELEASE_VERSION
          if (-not $version) { throw "RELEASE_VERSION is not set" }
          node -e "const fs=require('fs'); const v=process.env.RELEASE_VERSION; const raw=fs.readFileSync('CHANGELOG.md','utf8').replace(/\r\n/g,'\n'); const head=new RegExp('^## v'+v.replace(/[-/\\^$*+?.()|[\]{}]/g,'\\$&')+'\\b.*$','m'); const m=head.exec(raw); if(!m){ console.log('## v'+v+'\n\n- (No changelog section found)'); process.exit(0);} const start=m.index; const after=raw.slice(start); const next=after.slice(3).search(/^## v/m); const section=next>=0? after.slice(0, 3+next): after; const lines=section.split('\n'); const title=lines.shift(); const body=lines.join('\n').trim(); console.log((title||('## v'+v)).trim()+'\n\n'+(body||'- (No entries)')+'\n');" | Out-File -FilePath release-notes.md -Encoding utf8
          Add-Content -Path release-notes.md -Value "`nWeb Interface: https://rumsmokes.github.io/Gadgetboy-Command-Center"
          "RELEASE_NOTES_PATH=release-notes.md" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: List release artifacts
        run: |
          echo "Release folder contents:"
          dir release

      - name: Upload assets to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: ${{ github.event.inputs.tag || github.ref_name }}
          make_latest: 'true'
          body_path: ${{ env.RELEASE_NOTES_PATH }}
          files: |
            release/GB-POS-installerx64-${{ env.RELEASE_VERSION }}.exe
            release/GB-POS-installerx64-${{ env.RELEASE_VERSION }}.exe.blockmap
            release/Android-APK-universal-${{ env.RELEASE_VERSION }}.apk
            release/GadgetBoy-POS-Instructions-${{ env.RELEASE_VERSION }}.pdf
            release/latest.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
